name: discover
on:
  schedule:
    - cron: "0 * * * *"  # 每小时一轮
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run discovery (GitHub + official + meme-rush; X only if secret present)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 scripts/run_discovery.py
      - name: Commit data if changed
        run: |
          git config user.name "bsc-agent-radar-bot"
          git config user.email "bot@bsc-agent-radar.local"
          git add data/
          git diff --cached --quiet || git commit -m "discover: hourly update"
          git push
