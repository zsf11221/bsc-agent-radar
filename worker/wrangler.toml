name = "bsc-agent-radar-chain"
main = "src/index.js"
compatibility_date = "2026-11-09"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bsc-agent-radar-chain"
database_id = ""  # 创建 D1 后填入，不要把 id 写错地方；没有 D1 时 Worker 仍可返回 health

[vars]
# BSC_RPC_URL 不要写在这里，用 wrangler secret put BSC_RPC_URL（Chainstack）
